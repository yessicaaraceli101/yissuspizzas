<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard – TableTime</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body data-page="admin-dashboard">
  
  <header class="topbar admin">
    <div class="container row between align-center">
      <a class="brand" href="dashboard.html">
        <span>TableTime Admin</span>
      </a>
      <nav class="nav">
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="orders.html" class="">Orders</a>
        <a href="menu.html" class="">Menu</a>
        <a href="settings.html" class="">Settings</a>
      </nav>
      <div class="row gap">
        <button id="themeToggle" class="btn ghost" aria-label="Toggle theme">🌓</button>
        <button id="adminLogout" class="btn danger">Logout</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="grid three">
      <div class="stat card"><div class="stat-num" id="statOrders">0</div><div class="stat-label">Total orders</div></div>
      <div class="stat card"><div class="stat-num" id="statPending">0</div><div class="stat-label">Pending</div></div>
      <div class="stat card"><div class="stat-num" id="statDelivered">0</div><div class="stat-label">Delivered</div></div>
    </section>
    <section>
      <h2>Recent Orders</h2>
      <div id="recentOrders" class="table"></div>
    </section>
  </main>
  
  <footer class="footer admin">
    <div class="container row between align-center">
      <p>TableTime Admin</p>
      <div class="row gap sm">
        <a href="../index.html">← Back to site</a>
      </div>
    </div>
  </footer>

  <script src="../assets/script.js"></script>
</body>
</html>
