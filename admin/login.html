<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login – TableTime</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body data-page="admin-login">
  <header class="topbar admin">
    <div class="container row between align-center">
      <a class="brand" href="login.html"><span>TableTime Admin</span></a>
      <div class="row gap">
        <button id="themeToggle" class="btn ghost" aria-label="Toggle theme">🌓</button>
      </div>
    </div>
  </header>
  <main class="container narrow center">
    <div class="card stack">
      <h2>Admin Login</h2>
      <form id="adminLoginForm" class="stack">
        <label>Email
          <input type="email" name="email" required />
        </label>
        <label>Password
          <input type="password" name="password" required />
        </label>
        <button class="btn primary" type="submit">Login</button>
      </form>
      <p class="muted">Hint: use any email and password <code>admin123</code></p>
    </div>
  </main>
  
  <footer class="footer admin">
    <div class="container row between align-center">
      <p>TableTime Admin</p>
      <div class="row gap sm">
        <a href="../index.html">← Back to site</a>
      </div>
    </div>
  </footer>

  <script src="../assets/script.js"></script>
</body>
</html>
