<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Menu – TableTime</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body data-page="admin-menu">
  
  <header class="topbar admin">
    <div class="container row between align-center">
      <a class="brand" href="dashboard.html">
        <span>TableTime Admin</span>
      </a>
      <nav class="nav">
        <a href="dashboard.html" class="">Dashboard</a>
        <a href="orders.html" class="">Orders</a>
        <a href="menu.html" class="active">Menu</a>
        <a href="settings.html" class="">Settings</a>
      </nav>
      <div class="row gap">
        <button id="themeToggle" class="btn ghost" aria-label="Toggle theme">🌓</button>
        <button id="adminLogout" class="btn danger">Logout</button>
      </div>
    </div>
  </header>

  <main class="container">
    <h2>Menu Management</h2>
    <div class="card stack">
      <label>Restaurant
        <select id="adminRestaurantSelect"></select>
      </label>
      <div id="adminMenuList" class="table"></div>
      <form id="addMenuItem" class="row wrap gap">
        <input type="text" name="name" placeholder="Item name" required />
        <input type="number" name="price" placeholder="Price" min="0" step="0.01" required />
        <button class="btn" type="submit">Add Item</button>
      </form>
      <button id="saveMenu" class="btn primary">Save Changes</button>
    </div>
  </main>
  
  <footer class="footer admin">
    <div class="container row between align-center">
      <p>TableTime Admin</p>
      <div class="row gap sm">
        <a href="../index.html">← Back to site</a>
      </div>
    </div>
  </footer>

  <script src="../assets/script.js"></script>
</body>
</html>
