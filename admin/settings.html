<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Configuración – Yisuss Pizza</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body data-page="admin-settings">
  
  <header class="topbar admin">
    <div class="container row between align-center">
      <a class="brand" href="dashboard.html">
        <span>Yisuss Pizza Admin</span>
      </a>
      <button id="navToggle" class="btn ghost hamburger" aria-label="Abrir menú">☰</button>
        <nav class="nav">
        <a href="dashboard.html" class="">Panel</a>
        <a href="orders.html" class="">Pedidos</a>
        <a href="menu.html" class="">Menú</a>
        <a href="settings.html" class="active">Configuración</a>
      </nav>
      <div class="row gap">
        <button id="themeToggle" class="btn ghost" aria-label="Cambiar tema">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path
              d="M20.354 15.354A9 9 0 0 1 8.646 3.646 9.003 9.003 0 1 0 20.354 15.354Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
          </svg>
        </button>
        <button id="adminLogout" class="btn danger">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="container narrow">
    <h2>Configuración</h2>
    <form id="settingsForm" class="stack">
      <label>Costo de envío
        <input type="number" name="delivery_fee" min="0" step="0.01" />
      </label>
      <label>IVA / Impuesto (%)
        <input type="number" name="tax_rate" min="0" step="0.01" />
      </label>
      <button class="btn primary" type="submit">Guardar</button>
    </form>
  </main>
  
  <footer class="footer admin">
    <div class="container row between align-center">
      <p>Yisuss Pizza Admin</p>
      <div class="row gap sm">
        <a href="../index.html">← Volver al sitio</a>
      </div>
    </div>
  </footer>

  <script src="../assets/script.js"></script>
</body>
</html>
