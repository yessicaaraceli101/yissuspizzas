<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout – Yisuss Pizza</title>
    <link rel="stylesheet" href="assets/style.css" />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <!-- ========================================================== -->
    <!-- FIREBASE SDK (Agregado para conectar con Gastro)           -->
    <!-- ========================================================== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  </head>
  <body data-page="checkout">
    <header class="topbar">
      <div class="container row between align-center">
        <a class="brand" href="index.html">
          <img
            src="assets/img/IMG-20260526-WA0046.jpg"
            alt="Yisuss Pizza"
            width="40"
            height="40"
            style="border-radius: 50%; object-fit: cover;"
          />
          <span>Yisuss Pizza</span>
        </a>
        <nav class="nav">
          <a href="index.html" class="">Inicio</a>
          <a href="about.html" class="">Sobre</a>
          <a href="contact.html" class="">Contacto</a>
          <a href="faq.html" class="">Preguntas frecuentes</a>
        </nav>
        <div class="nav-right">
          <div class="row gap">
            <button
              id="themeToggle"
              class="btn ghost"
              aria-label="Toggle theme"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
            <a class="btn" href="checkout.html">Carrito</a>
          </div>
          <button
            id="navToggle"
            class="btn ghost hamburger"
            aria-label="Toggle menu"
          >
            ☰
          </button>
        </div>
      </div>
    </header>

    <main class="container grid two">
      <section>
        <h2>Continuar</h2>
        <form id="checkoutForm" class="stack">
          <div class="field two">
            <label
              >Nombre
              <input type="text" name="name" required />
            </label>
            <label
              >Email (opcional)
              <input type="email" name="email" />
            </label>
          </div>
          <div class="field two">
            <label
              >Teléfono
              <input type="tel" name="phone" required />
            </label>
            <label
              >Tipo de entrega
              <select id="deliveryType" name="deliveryType">
                <option value="delivery">Delivery</option>
                <option value="pickup">Retiro en el local</option>
              </select>
            </label>
          </div>
          <div id="deliveryFields">
            <div class="field two">
              <label
                >Ciudad de entrega
                <input type="text" name="city" />
              </label>
              <label
                >Dirección
                <input type="text" name="address" />
              </label>
            </div>
          </div>
          <label
            >Instrucciones de entrega (opcional)
            <textarea name="notes"></textarea>
          </label>
          <div style="display: flex; gap: 12px;">
            <button class="btn primary" type="submit">Confirmar pedido</button>
            <button
              type="button"
              id="cancelOrder"
              class="btn"
              style="background: #E24B4A; border-color: #E24B4A; color: #ffffff;"
              onclick="document.getElementById('cancelModal').style.display='flex';"
            >
              Cancelar pedido
            </button>
          </div>
        </form>
      </section>
      <aside class="summary">
        <h2>Orden</h2>
        <div id="cartSummary"></div>
        <div class="totals">
          <div><span>Subtotal</span><span id="subtotal">Gs. 0</span></div>
          <div><span>Delivery</span><span id="deliveryFee">Gs. 0</span></div>
          <div class="bold">
            <span>Total</span><span id="total">Gs. 0</span>
          </div>
        </div>
      </aside>
    </main>

    <div
      id="cancelModal"
      style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 1000;"
    >
      <div
        style="background: #ffffff; border-radius: 12px; padding: 28px; max-width: 380px; width: 90%; box-shadow: 0 8px 24px rgba(0,0,0,0.15); text-align: center;"
      >
        <div style="margin: 0 auto 16px; width: 48px; height: 48px; border-radius: 50%; background: #FCEBEB; display: flex; align-items: center; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E24B4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
        </div>
        <h3 style="margin: 0 0 8px; font-size: 18px;">¿Cancelar pedido?</h3>
        <p style="margin: 0 0 24px; color: #666; font-size: 14px;">
          Se va a borrar toda la información que completaste y volverás al
          inicio. Esta acción no se puede deshacer.
        </p>
        <div style="display: flex; gap: 12px; justify-content: center;">
          <button
            type="button"
            class="btn"
            onclick="document.getElementById('cancelModal').style.display='none';"
          >
            No, volver
          </button>
          <button
            type="button"
            class="btn"
            style="background: #E24B4A; border-color: #E24B4A; color: #ffffff;"
            onclick="document.getElementById('checkoutForm').reset(); window.location.href='index.html';"
          >
            Sí, cancelar
          </button>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="container row align-center" style="justify-content: center;">
        <p>© 2026 Yisuss Pizza.</p>
      </div>
    </footer>

    <!-- ========================================================== -->
    <!-- Muestra/oculta ciudad y dirección según el tipo de entrega. -->
    <!-- El CÁLCULO de los totales (subtotal/delivery/tax/total) ya -->
    <!-- NO se hace acá: eso ahora vive únicamente en script.js,    -->
    <!-- para evitar que dos lógicas distintas compitan y generen   -->
    <!-- inconsistencias entre lo que se ve y lo que se guarda.     -->
    <!-- ========================================================== -->
    <script>
      const deliveryTypeSelect = document.getElementById("deliveryType");
      const deliveryFields = document.getElementById("deliveryFields");
      const cityInput = document.querySelector('input[name="city"]');
      const addressInput = document.querySelector('input[name="address"]');

      function toggleDeliveryFields() {
        const isPickup = deliveryTypeSelect.value === "pickup";
        deliveryFields.style.display = isPickup ? "none" : "block";
        cityInput.required = !isPickup;
        addressInput.required = !isPickup;
        if (isPickup) {
          cityInput.value = "";
          addressInput.value = "";
        }
      }

      deliveryTypeSelect.addEventListener("change", toggleDeliveryFields);
      toggleDeliveryFields();
    </script>

    <!-- ========================================================== -->
    <!-- TU ARCHIVO SCRIPT.JS (MODIFICADO PARA FIREBASE)            -->
    <!-- ========================================================== -->
    <script src="assets/script.js"></script>
  </body>
</html>
