<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout – TableTime</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body data-page="checkout">
  
  <header class="topbar">
    <div class="container row between align-center">
      <a class="brand" href="index.html">
        <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c3.866 0 7 3.134 7 7 0 3.087-1.99 5.703-4.737 6.613L14 22l-2-.5 1.086-5.267C9.398 15.978 7 13.237 7 9.999 7 5.925 9.925 3 14 3c-1.06-0.627-2.29-1-3.62-1-4.418 0-8 3.582-8 8 0 3.872 2.754 7.096 6.393 7.852L8 22l-2-.5 .73-3.527C3.43 16.953 1 13.794 1 10 1 5.029 5.029 1 10 1s9 4.029 9 9-4.029 9-9 9-1.5-.08-2.2-.23" fill="currentColor"/></svg>
        <span>TableTime</span>
      </a>
      <nav class="nav">
        <a href="index.html" class="">Home</a>
        <a href="about.html" class="">About</a>
        <a href="contact.html" class="">Contact</a>
        <a href="faq.html" class="">FAQ</a>
      </nav>
      <div class="row gap">
        <a class="admin-link" href="admin/login.html" title="Admin">Admin</a>
        <button id="themeToggle" class="btn ghost" aria-label="Toggle theme">🌓</button>
        <a class="btn" href="checkout.html">Cart</a>
      </div>
    </div>
  </header>

  <main class="container grid two">
    <section>
      <h2>Guest Checkout</h2>
      <form id="checkoutForm" class="stack">
        <div class="field two">
          <label>Full name
            <input type="text" name="name" required />
          </label>
          <label>Email
            <input type="email" name="email" required />
          </label>
        </div>
        <div class="field two">
          <label>Phone
            <input type="tel" name="phone" required />
          </label>
          <label>Delivery city
            <input type="text" name="city" required />
          </label>
        </div>
        <label>Address
          <input type="text" name="address" required />
        </label>
        <label>Delivery instructions (optional)
          <textarea name="notes"></textarea>
        </label>
        <h3>Payment</h3>
        <div class="field two">
          <label>Card number
            <input type="text" name="card" placeholder="4242 4242 4242 4242" minlength="15" maxlength="19" required />
          </label>
          <label>Expiry
            <input type="text" name="exp" placeholder="MM/YY" pattern="\d{2}/\d{2}" required />
          </label>
        </div>
        <div class="field two">
          <label>CVV
            <input type="text" name="cvv" minlength="3" maxlength="4" required />
          </label>
          <label>Postal code
            <input type="text" name="postal" required />
          </label>
        </div>
        <button class="btn primary" type="submit">Pay now</button>
      </form>
    </section>
    <aside class="summary">
      <h2>Order Summary</h2>
      <div id="cartSummary"></div>
      <div class="totals">
        <div><span>Subtotal</span><span id="subtotal">$0.00</span></div>
        <div><span>Delivery</span><span id="deliveryFee">$0.00</span></div>
        <div><span>Tax</span><span id="tax">$0.00</span></div>
        <div class="bold"><span>Total</span><span id="total">$0.00</span></div>
      </div>
    </aside>
  </main>
  
  <footer class="footer">
    <div class="container row between align-center">
      <p>© 2025 TableTime. All rights reserved.</p>
      <div class="row gap sm">
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
      </div>
    </div>
  </footer>

  <script src="assets/script.js"></script>
</body>
</html>
