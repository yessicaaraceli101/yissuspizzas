<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pedido Confirmado – Yisuss Pizza</title>
    <link rel="stylesheet" href="assets/style.css" />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <!-- ========================================================== -->
    <!-- FIREBASE SDK (Agregado para conectar con Gastro)           -->
    <!-- ========================================================== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  </head>
  <body data-page="confirm">
    <header class="topbar">
      <div class="container row between align-center">
        <a class="brand" href="index.html">
          <img
            src="assets/img/IMG-20260526-WA0046.jpg"
            alt="Yisuss Pizza"
            width="40"
            height="40"
            style="border-radius: 50%; object-fit: cover;"
          />
          <span>Yisuss Pizza</span>
        </a>

        <nav class="nav">
          <a href="index.html" class="">Inicio</a>
          <a href="about.html" class="">Sobre</a>
          <a href="contact.html" class="">Contacto</a>
          <a href="faq.html" class="">Preguntas frecuentes</a>
        </nav>
        <div class="nav-right">
          <div class="row gap">
            <button
              id="themeToggle"
              class="btn ghost"
              aria-label="Toggle theme"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
            <a class="btn" href="checkout.html">Carrito</a>
          </div>
          <button
            id="navToggle"
            class="btn ghost hamburger"
            aria-label="Toggle menu"
          >
            ☰
          </button>
        </div>
      </div>
    </header>

    <main class="container narrow center">
      <div id="confirmation" class="card stack center">
        <div class="big">
          <svg
            width="56"
            height="56"
            viewBox="0 0 52 52"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="26" cy="26" r="25" fill="#22c55e" />
            <path
              d="M15 27.5 L22.5 35 L38 18"
              fill="none"
              stroke="#ffffff"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <h2>¡Tu pedido fue confirmado!</h2>
        <p id="orderId" class="muted"></p>
        <div id="orderSummary" class="stack" style="width:100%; max-width:400px; margin:0 auto;"></div>
        <a class="btn" href="index.html">Volver al inicio</a>
      </div>
    </main>

    <footer class="footer">
      <div class="container row align-center" style="justify-content: center;">
        <p>© 2026 Yisuss Pizza.</p>
      </div>
    </footer>

    <!-- ========================================================== -->
    <!-- TU ARCHIVO SCRIPT.JS (MODIFICADO PARA FIREBASE)            -->
    <!-- ========================================================== -->
    <script src="assets/script.js"></script>
  </body>
</html>
