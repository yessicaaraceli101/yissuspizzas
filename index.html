<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yisuss Pizza</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <!-- ========================================================== -->
    <!-- FIREBASE SDK (Agregado para conectar con Gastro)           -->
    <!-- ========================================================== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  </head>
  <body data-page="index">
    <header class="topbar">
      <div class="container row between align-center">
        <a class="brand" href="index.html">
          <img src="assets/img/IMG-20260526-WA0046.jpg" alt="Yisuss Pizza" height="36" />
          <span>Yisuss Pizza</span>
        </a>

        <nav class="nav">
          <a href="index.html" class="active">Inicio</a>
          <a href="about.html" class="">Sobre</a>
          <a href="contact.html" class="">Contacto</a>
          <a href="faq.html" class="">Preguntas frecuentes</a>
        </nav>
        <div class="nav-right">
          <div class="row gap">
            <button
              id="themeToggle"
              class="btn ghost"
              aria-label="Cambiar tema"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path
                  d="M20.354 15.354A9 9 0 0 1 8.646 3.646 9.003 9.003 0 1 0 20.354 15.354Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  fill="none"
                />
              </svg>
            </button>
            <a class="btn" href="checkout.html">Carrito</a>
          </div>
          <button
            id="navToggle"
            class="btn ghost hamburger"
            aria-label="Abrir menú"
          >
            ☰
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1>Yisuss pizzas</h1>
        <p>
          Elegí el sabor que más te gusta
        </p>
        <div class="searchbar row wrap gap">
          <input type="text" id="q" placeholder="Buscar..." />
          <!-- Filtra por categoría (Pizzas, Pastas, Bebidas, Postres...).
               script.js llena las opciones con las categorías reales que
               tenga cada negocio. -->
          <select id="cuisineFilter">
            <option value="">Todas las categorías</option>
          </select>
          <!-- Filtra por sabor puntual (el nombre del plato, ej. "Pizza
               Pepperoni"). Antes este selector filtraba por ciudad, un
               dato que no aplica acá (todos los platos quedaban con
               city: "N/A") — script.js ahora lo llena con los nombres de
               los platos en vez de ciudades. -->
          <select id="cityFilter">
            <option value="">Todos los sabores</option>
          </select>
          <button id="searchBtn" class="btn">Buscar</button>
        </div>
      </section>
      <section>
        <div id="results" class="grid cards"></div>
        <div id="noResults" class="muted" style="display: none">
          No hay pizzas que coincidan con tu búsqueda.
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container" style="text-align: center;">
        <p>© 2026 Yisuss Pizza.</p>
      </div>
    </footer>

</html>
