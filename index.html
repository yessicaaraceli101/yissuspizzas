<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TableTime – Find & Book Restaurants</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body data-page="index">
    <header class="topbar">
      <div class="container row between align-center">
        <a class="brand" href="index.html">
          <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2c3.866 0 7 3.134 7 7 0 3.087-1.99 5.703-4.737 6.613L14 22l-2-.5 1.086-5.267C9.398 15.978 7 13.237 7 9.999 7 5.925 9.925 3 14 3c-1.06-0.627-2.29-1-3.62-1-4.418 0-8 3.582-8 8 0 3.872 2.754 7.096 6.393 7.852L8 22l-2-.5 .73-3.527C3.43 16.953 1 13.794 1 10 1 5.029 5.029 1 10 1s9 4.029 9 9-4.029 9-9 9-1.5-.08-2.2-.23"
              fill="currentColor"
            />
          </svg>
          <span>TableTime</span>
        </a>

        <nav class="nav">
          <a href="index.html" class="active">Home</a>
          <a href="about.html" class="">About</a>
          <a href="contact.html" class="">Contact</a>
          <a href="faq.html" class="">FAQ</a>
        </nav>
        <div class="nav-right">
          <div class="row gap">
            <a class="admin-link" href="admin/login.html" title="Admin"
              >Admin</a
            >
            <button
              id="themeToggle"
              class="btn ghost"
              aria-label="Toggle theme"
            >
              🌓
            </button>
            <a class="btn" href="checkout.html">Cart</a>
          </div>
          <button
            id="navToggle"
            class="btn ghost hamburger"
            aria-label="Toggle menu"
          >
            ☰
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1>Book a table or order delivery</h1>
        <p>
          Browse top-rated spots near you and checkout as a guest — no account
          required.
        </p>
        <div class="searchbar row wrap gap">
          <input type="text" id="q" placeholder="Search by name or cuisine…" />
          <select id="cuisineFilter">
            <option value="">All cuisines</option>
          </select>
          <select id="cityFilter">
            <option value="">All cities</option>
          </select>
          <button id="searchBtn" class="btn">Search</button>
        </div>
      </section>
      <section>
        <div id="results" class="grid cards"></div>
        <div id="noResults" class="muted" style="display: none">
          No restaurants match your filters.
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container row between align-center">
        <p>© 2025 TableTime. All rights reserved.</p>
        <div class="row gap sm">
          <a href="terms.html">Terms</a>
          <a href="privacy.html">Privacy</a>
        </div>
      </div>
    </footer>

    <script src="assets/script.js"></script>
  </body>
</html>
